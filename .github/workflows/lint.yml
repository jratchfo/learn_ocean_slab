# Check formatting and lint with ruff on every push and pull request.
# This only reports problems (a check mark or a cross on the commit); it never changes the code.
# Settings come from [tool.ruff] in pyproject.toml. To fix locally: uv run ruff format . && uv run ruff check --fix .
name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
